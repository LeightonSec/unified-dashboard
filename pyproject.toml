# unified-dashboard is a flat-module Flask application (app.py at repo root)
# launched via `python3 app.py`, NOT an installable package. So there is
# deliberately no [build-system]/[project] table and CI does not
# `pip install -e .`.
#
# NOTE on test import resolution: there is intentionally NO pythonpath setting.
# tests/ is a package (tests/__init__.py) and the repo root is not, so pytest's
# default prepend import mode inserts the repo root into sys.path and the
# `from app import app` import resolves on its own. Verified with bare `pytest`
# from the repo root. conftest.py (repo root) sets a dummy SECRET_KEY before
# app.py is imported (app.py is fail-closed on a missing SECRET_KEY).

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP"]
ignore = ["E501"]
